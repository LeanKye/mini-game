<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пропуск агента - метка для AR</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 24px;
      background: #f3eefc; color: #241a3d;
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .hint { max-width: 460px; text-align: center; font-size: 15px; line-height: 1.5; color: #4a3a78; }
    .card {
      width: 360px; padding: 18px; background: #fff; border-radius: 18px;
      box-shadow: 0 18px 40px -20px rgba(58, 42, 106, 0.6);
      border: 3px solid #2a1c4d;
    }
    .card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card__eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8c6bd6; font-weight: 800; }
    .card__title { font-size: 20px; font-weight: 800; }
    .marker {
      width: 260px; height: 260px; margin: 0 auto; padding: 14px;
      background: #fff; border: 10px solid #000; display: flex; align-items: center; justify-content: center;
    }
    .marker img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .card__foot { margin-top: 12px; font-size: 13px; color: #5b3d8f; text-align: center; }
    .card__code { font-family: ui-monospace, monospace; letter-spacing: 3px; }
    button {
      border: 0; background: #8c6bd6; color: #fff; font: inherit; font-weight: 800;
      padding: 12px 22px; border-radius: 12px; cursor: pointer;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .hint, button { display: none; }
      .card { box-shadow: none; border-radius: 0; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <p class="hint">
    Это метка для AR-уровня «Охота на духов». Распечатай лист или открой карточку на втором
    экране и наведи на неё камеру телефона. Чёрную рамку обрезать нельзя - иначе AR не зацепится.
  </p>
  <div class="card">
    <div class="card__top">
      <span class="card__eyebrow">Доступ: агент</span>
      <span class="card__title">Пропуск</span>
    </div>
    <div class="marker"><img src="hiro.png" alt="HIRO marker"></div>
    <p class="card__foot">Отдел: <b>охота на духов</b> · Код <span class="card__code">AR-10</span></p>
  </div>
  <button onclick="window.print()">Печать</button>
</body>
</html>
