<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe1ec">
  <title>Звёздная тропинка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="bg-deco" aria-hidden="true"></div>

    <section id="screen-lobby" class="screen screen--lobby hidden">
      <div class="lobby">
        <p class="eyebrow" id="lobby-eyebrow"></p>
        <div class="levels" id="levels">
          <div class="levels__track" id="levels-track"></div>
        </div>
        <div class="lobby__dots" id="lobby-dots"></div>
        <p class="lobby__hint" id="lobby-hint"></p>
      </div>
    </section>

    <section id="screen-game" class="screen screen--game hidden">
      <header class="hud">
        <button type="button" class="hud__back" id="btn-back" aria-label="К уровням">‹</button>
        <span class="hud__title" id="hud-title"></span>
        <span class="hud__timer" id="hud-timer" hidden></span>
        <span class="hud__stars" id="hud-stars">
          <span class="hud__star">★</span>
          <b id="hud-collected">0</b><span class="hud__sep">/</span><span id="hud-total">0</span>
        </span>
        <button type="button" class="hud__skip hidden" id="btn-skip"></button>
      </header>
      <p class="hud__hint" id="game-hint" role="status" aria-live="polite"></p>
      <div class="stage">
        <canvas id="game-canvas"></canvas>
      </div>
      <div class="controls" id="controls">
        <div class="controls__move">
          <button type="button" class="pad" id="pad-left" aria-label="Влево">◀</button>
          <button type="button" class="pad" id="pad-right" aria-label="Вправо">▶</button>
        </div>
        <button type="button" class="pad pad--jump" id="pad-jump" aria-label="Прыжок">⤒</button>
      </div>
      <div class="intro hidden" id="game-intro">
        <div class="intro__card">
          <p class="eyebrow" id="intro-eyebrow"></p>
          <h2 class="intro__title" id="intro-title"></h2>
          <p class="intro__text" id="intro-text"></p>
          <button type="button" class="btn btn--primary" id="btn-intro"></button>
        </div>
      </div>
    </section>

    <section id="screen-reward" class="screen screen--reward hidden">
      <div class="reward card">
        <p class="eyebrow" id="reward-eyebrow"></p>
        <h2 class="reward__title" id="reward-title"></h2>
        <div class="reward__story" id="reward-story"></div>
        <div class="reward__puzzle hidden" id="reward-puzzle">
          <p class="reward__puzzle-label" id="puzzle-label"></p>
          <div class="puzzle" id="puzzle-board"></div>
          <p class="reward__puzzle-hint" id="puzzle-hint"></p>
        </div>
        <div class="reward__code-block hidden" id="reward-code-block">
          <p class="reward__code-label" id="code-label"></p>
          <button type="button" class="reward__code" id="reward-code"></button>
          <p class="reward__code-hint" id="code-hint"></p>
        </div>
        <p class="reward__bonus" id="reward-bonus"></p>
        <div class="reward__actions">
          <button type="button" class="btn btn--ghost" id="btn-lobby"></button>
          <button type="button" class="btn btn--ghost" id="btn-replay"></button>
        </div>
      </div>
    </section>
  </div>

  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
